configVersion: 2.0.0
generation:
  devContainers:
    enabled: true
    schemaPath: registry.speakeasyapi.dev/glean-el2/sdk/glean-api-specs
  sdkClassName: Glean
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  useClassNamesForArrayFields: true
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: true
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: true
    sharedErrorComponentsApr2025: true
    sharedNestedComponentsJan2026: false
    nameOverrideFeb2026: false
  auth:
    oAuth2ClientCredentialsEnabled: true
    oAuth2PasswordEnabled: true
    hoistGlobalSecurity: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: ""
  versioningStrategy: automatic
  mockServer:
    disabled: false
  persistentEdits:
    enabled: "true"
  tests:
    generateTests: true
    generateNewTests: true
    skipResponseBodyAssertions: true
typescript:
  version: 0.14.15
  acceptHeaderEnum: true
  additionalDependencies:
    dependencies: {}
    devDependencies: {}
    peerDependencies: {}
  additionalPackageJSON:
    exports:
      ./hooks:
        import:
          '@gleanwork/api-client/source': ./src/hooks/index.ts
          default: ./dist/esm/hooks/index.js
          types: ./dist/esm/hooks/index.d.ts
        require:
          default: ./dist/commonjs/hooks/index.js
          types: ./dist/commonjs/hooks/index.d.ts
      ./hooks/*:
        import:
          '@gleanwork/api-client/source': ./src/hooks/*.ts
          default: ./dist/esm/hooks/*.js
          types: ./dist/esm/hooks/*.d.ts
        require:
          default: ./dist/commonjs/hooks/*.js
          types: ./dist/commonjs/hooks/*.d.ts
      ./hooks/*.js:
        import:
          '@gleanwork/api-client/source': ./src/hooks/*.ts
          default: ./dist/esm/hooks/*.js
          types: ./dist/esm/hooks/*.d.ts
        require:
          default: ./dist/commonjs/hooks/*.js
          types: ./dist/commonjs/hooks/*.d.ts
    tshy:
      exports:
        ./hooks: ./src/hooks/index.ts
        ./hooks/*: ./src/hooks/*.ts
        ./hooks/*.js: ./src/hooks/*.ts
  additionalScripts: {}
  alwaysIncludeInboundAndOutbound: false
  author: Speakeasy
  baseErrorName: GleanBaseError
  clientServerStatusCodesAsErrors: true
  constFieldsAlwaysOptional: false
  defaultErrorName: GleanError
  enableCustomCodeRegions: false
  enableMCPServer: false
  enableReactQuery: true
  enumFormat: union
  envVarPrefix: GLEAN
  exportZodModelNamespace: false
  fixEnumNameSanitization: false
  flatAdditionalProperties: false
  flattenGlobalSecurity: true
  flatteningOrder: body-first
  formStringArrayEncodeMode: encoded-string
  forwardCompatibleEnumsByDefault: true
  forwardCompatibleUnionsByDefault: "false"
  generateExamples: true
  imports:
    option: openapi
    paths:
      callbacks: models/callbacks
      errors: models/errors
      operations: models/operations
      shared: models/components
      webhooks: models/webhooks
  inferUnionDiscriminators: true
  inputModelSuffix: input
  jsonpath: rfc9535
  laxMode: strict
  legacyFileNaming: true
  maxMethodParams: 5
  methodArguments: require-security-and-request
  modelPropertyCasing: camel
  moduleFormat: dual
  multipartArrayFormat: standard
  outputModelSuffix: output
  packageName: '@gleanwork/api-client'
  preApplyUnionDiscriminators: true
  preserveModelFieldNames: false
  responseFormat: flat
  sseFlatResponse: false
  templateVersion: v2
  unionStrategy: left-to-right
  usageSDKInitImports: []
  useIndexModules: true
  useOxlint: false
  useTsgo: false
  zodVersion: v3
